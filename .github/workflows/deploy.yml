name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      # Deps da raiz afetam TODOS os builds; sem estes, um fix de dependência
      # (ex.: pnpm.overrides) não disparava CI nenhum e nunca ia a produção.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/parkingmanagerbr-hue/runquest-api
  IMAGE_WEB: ghcr.io/parkingmanagerbr-hue/runquest-web

jobs:
  # Gate de qualidade: lint + testes dos dois apps. O build/deploy SÓ roda se
  # este job passar (needs abaixo) — produção nunca sobe com teste vermelho.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — a action lê o `packageManager` do package.json raiz.
      # Declarar nos dois lugares é ERRO FATAL para a action ("Multiple versions
      # of pnpm specified") e derrubava o verify antes de qualquer teste.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prisma client (api typecheck precisa)
        run: pnpm --filter @runquest/api prisma:generate
      - name: Lint (web + api)
        run: pnpm -r lint
      - name: Testes unitários (web vitest + api jest)
        run: pnpm -r test
      # A suíte e2e não rodava em lugar nenhum (nem aqui, nem localmente sem
      # webServer) — e por isso tinha apodrecido com asserções quebradas.
      # Agora o Playwright sobe o app sozinho e o gate cobre a landing de verdade.
      - name: Navegador do Playwright
        run: pnpm --filter @runquest/web exec playwright install --with-deps chromium
      - name: Testes e2e (playwright)
        run: pnpm --filter @runquest/web test:e2e

  build-api:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://runquest.veloxisit.com.br/api
          tags: ${{ env.IMAGE_WEB }}:latest,${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull latest images
            docker pull ghcr.io/parkingmanagerbr-hue/runquest-api:latest
            docker pull ghcr.io/parkingmanagerbr-hue/runquest-web:latest

            # Restart API
            docker rm -f platform-runquest-api-1 || true
            docker run -d \
              --name platform-runquest-api-1 \
              --hostname runquest-api \
              --network platform_internal \
              --network-alias runquest-api \
              --restart unless-stopped \
              --env-file /opt/platform/secrets/runquest.env \
              --label com.docker.compose.project=platform \
              --label com.docker.compose.service=runquest-api \
              ghcr.io/parkingmanagerbr-hue/runquest-api:latest

            # Restart Web
            docker rm -f platform-runquest-web-1 || true
            docker run -d \
              --name platform-runquest-web-1 \
              --hostname runquest-web \
              --network platform_internal \
              --network-alias runquest-web \
              --restart unless-stopped \
              -e NEXT_PUBLIC_API_URL=https://runquest.veloxisit.com.br/api \
              -e NEXT_TELEMETRY_DISABLED=1 \
              --label com.docker.compose.project=platform \
              --label com.docker.compose.service=runquest-web \
              ghcr.io/parkingmanagerbr-hue/runquest-web:latest

            # Run DB migrations
            sleep 5
            docker exec platform-runquest-api-1 npx prisma migrate deploy || true

            echo "Deploy complete"
