<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Concept 04 — Stride Mark (Nike-inspired swoosh)</title>
  <defs>
    <linearGradient id="c04-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#FF3E8E"/>
      <stop offset="100%" stop-color="#5B2EFF"/>
    </linearGradient>
    <linearGradient id="c04-stroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A8FF3E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#c04-bg)"/>

  <!-- Stride: 3 marcas de passada em arco crescente, formando uma seta ascendente -->
  <g fill="url(#c04-stroke)">
    <!-- Passo 1 (menor, atrás) -->
    <path d="M 200,720
             Q 240,640 340,640
             Q 410,640 410,720
             Q 410,800 340,800
             Q 250,800 200,720 Z"
          opacity="0.55"/>
    <!-- Passo 2 (médio) -->
    <path d="M 360,580
             Q 410,470 540,470
             Q 620,470 620,570
             Q 620,670 540,670
             Q 410,670 360,580 Z"
          opacity="0.85"/>
    <!-- Passo 3 (maior, à frente — formando ponta da seta) -->
    <path d="M 560,400
             Q 620,260 800,260
             Q 900,260 900,380
             Q 900,510 800,510
             Q 630,510 560,400 Z"/>
  </g>

  <!-- Linha de momentum atrás -->
  <path d="M 150,820 Q 350,780 560,650 T 880,420"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.25"/>

  <!-- Spark final -->
  <circle cx="900" cy="320" r="22" fill="#FFE15A"/>
  <circle cx="900" cy="320" r="40" fill="none" stroke="#FFE15A" stroke-width="4" opacity="0.4"/>
</svg>
