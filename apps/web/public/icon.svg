<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1280" width="1024" height="1280">
  <title>RunQuest — Gold Shield (recreated from uploaded reference)</title>
  <defs>
    <!-- Backgrounds -->
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0a1840"/>
      <stop offset="50%" stop-color="#020410"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Shield body (dark blue gradient with depth) -->
    <linearGradient id="shieldBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142960"/>
      <stop offset="40%" stop-color="#0a1840"/>
      <stop offset="100%" stop-color="#020610"/>
    </linearGradient>

    <!-- Silver/chrome bevel -->
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8ee"/>
      <stop offset="15%" stop-color="#c2c2cc"/>
      <stop offset="50%" stop-color="#6a6a78"/>
      <stop offset="85%" stop-color="#3a3a48"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>

    <!-- Gold gradient (runner + wordmark) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6A8"/>
      <stop offset="20%" stop-color="#FFE15A"/>
      <stop offset="50%" stop-color="#E5A816"/>
      <stop offset="80%" stop-color="#C77800"/>
      <stop offset="100%" stop-color="#7A4A00"/>
    </linearGradient>

    <!-- Gold horizontal shimmer -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE15A"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFE15A"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE15A"/>
    </linearGradient>

    <!-- Cyan halo (Q) -->
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#FFE15A" flood-opacity="0.7"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
      <feFlood flood-color="#60A5FA" flood-opacity="0.8"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bevelInset" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Light beams from top -->
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shield path -->
    <path id="shieldPath" d="M 512,120
      L 880,220
      L 880,560
      C 880,720 720,880 512,960
      C 304,880 144,720 144,560
      L 144,220 Z"/>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="1280" fill="url(#bg)"/>

  <!-- Light beams radiating from top center -->
  <g opacity="0.4">
    <path d="M 460,80 L 380,520 L 540,520 Z" fill="url(#beam)"/>
    <path d="M 512,60 L 460,580 L 564,580 Z" fill="url(#beam)" opacity="0.6"/>
    <path d="M 564,80 L 484,520 L 644,520 Z" fill="url(#beam)"/>
  </g>
  <ellipse cx="512" cy="120" rx="240" ry="80" fill="#FFFFFF" opacity="0.15"/>

  <!-- SHIELD — outer silver bevel layer -->
  <g>
    <use href="#shieldPath" fill="url(#bevel)" transform="translate(0,-4)"/>
    <use href="#shieldPath" fill="url(#shieldBody)" transform="scale(0.96) translate(20,12)"/>
    <!-- Inner silver inset -->
    <use href="#shieldPath" fill="none" stroke="url(#bevel)" stroke-width="14" transform="scale(0.88) translate(60,40)"/>
    <!-- Inner darker shield -->
    <use href="#shieldPath" fill="url(#shieldBody)" transform="scale(0.82) translate(92,60)"/>
    <!-- Subtle highlight on top of shield -->
    <path d="M 200,200 L 824,220 L 824,260 Q 512,200 200,260 Z" fill="#FFFFFF" opacity="0.05"/>
  </g>

  <!-- CYAN "Q" RING around runner — luminous halo -->
  <g filter="url(#cyanGlow)" transform="translate(512,520)">
    <!-- Open ring (Q-like, with tail at bottom-right) -->
    <path d="M 0,-200
             A 200,200 0 1 1 141,141
             L 90,90
             A 130,130 0 1 0 0,-130 Z"
          fill="url(#cyan)" opacity="0.9"/>
    <!-- Inner highlight ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <!-- Tail "Q" -->
    <path d="M 110,110 L 210,210" stroke="url(#cyan)" stroke-width="36" stroke-linecap="round"/>
  </g>

  <!-- Runner stars/sparkles inside Q area -->
  <g fill="#7DD3FC" opacity="0.7">
    <circle cx="380" cy="420" r="2"/>
    <circle cx="650" cy="450" r="2.5"/>
    <circle cx="600" cy="610" r="2"/>
    <circle cx="420" cy="650" r="2"/>
    <circle cx="340" cy="540" r="1.5"/>
  </g>

  <!-- RUNNER (gold silhouette mid-stride, facing right) -->
  <g fill="url(#gold)" transform="translate(380,360)" filter="url(#goldGlow)">
    <!-- Head -->
    <circle cx="170" cy="46" r="34"/>
    <!-- Neck-shoulder + torso (athletic, leaning forward) -->
    <path d="M 152,80
             C 148,98 158,118 178,124
             L 246,148
             C 268,156 280,180 274,200
             L 256,242
             C 250,256 234,262 222,256
             L 168,232
             C 152,224 142,208 146,192
             L 158,118
             C 160,100 156,90 152,80 Z"/>
    <!-- Front arm (extended forward+up, fist closed) -->
    <path d="M 250,148
             C 280,128 314,108 344,82
             C 358,72 372,58 380,42
             C 384,34 392,30 400,38
             C 408,46 406,56 398,68
             C 380,98 358,128 332,150
             C 314,166 290,182 270,190 Z"/>
    <!-- Back arm (swung back, bent elbow with fist) -->
    <path d="M 172,138
             C 154,150 132,162 110,180
             C 92,194 78,210 70,224
             C 64,232 56,234 48,228
             C 40,222 44,212 54,200
             C 70,176 92,156 116,144
             C 134,134 154,128 168,128 Z"/>
    <!-- Lead leg (knee raised high — power) -->
    <path d="M 222,256
             C 232,278 244,304 250,330
             C 254,348 252,366 240,378
             C 232,388 218,392 210,386
             C 200,378 198,362 202,348
             C 206,326 200,304 192,286
             C 184,272 186,260 196,254 Z"/>
    <!-- Trailing leg (extended back — push-off) -->
    <path d="M 168,228
             C 150,260 124,296 102,324
             C 84,344 64,358 46,360
             C 34,360 28,352 32,342
             C 36,332 50,326 64,318
             C 90,302 110,276 124,250
             C 136,230 148,214 162,206 Z"/>
    <!-- Front foot (mid-air sneaker) -->
    <ellipse cx="218" cy="394" rx="32" ry="13" transform="rotate(-10 218 394)"/>
    <!-- Back foot -->
    <ellipse cx="30" cy="358" rx="30" ry="12" transform="rotate(-18 30 358)"/>
    <!-- Muscle definition lines (subtle) -->
    <path d="M 200,180 L 230,200" stroke="#7A4A00" stroke-width="3" opacity="0.4" fill="none"/>
    <path d="M 220,260 L 240,290" stroke="#7A4A00" stroke-width="3" opacity="0.4" fill="none"/>
  </g>

  <!-- Speed streak under runner -->
  <g opacity="0.85">
    <path d="M 280,720 Q 400,700 540,680 T 760,640"
          stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 280,720 Q 400,700 540,680 T 760,640"
          stroke="#FFE15A" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- WORDMARK "RunQuest" — RPG style gold lettering -->
  <g transform="translate(512,1110)" text-anchor="middle">
    <text font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif"
          font-size="148" font-weight="900" font-style="italic"
          fill="url(#gold)"
          stroke="#7A4A00" stroke-width="2"
          filter="url(#goldGlow)">
      RunQuest
    </text>
    <!-- Shimmer overlay -->
    <text font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif"
          font-size="148" font-weight="900" font-style="italic"
          fill="url(#goldShine)" opacity="0.4">
      RunQuest
    </text>
  </g>

  <!-- Decorative flourishes under wordmark -->
  <g stroke="url(#gold)" stroke-width="3" fill="none" opacity="0.7" filter="url(#goldGlow)">
    <path d="M 240,1180 Q 360,1190 480,1180"/>
    <path d="M 544,1180 Q 664,1190 784,1180"/>
    <circle cx="512" cy="1182" r="4" fill="url(#gold)"/>
  </g>
</svg>
