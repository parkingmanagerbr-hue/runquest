# Adicionar em /etc/nginx/sites-available/ (ou ao nginx do platform-nginx-1)

server {
    listen 80;
    server_name runquest.veloxisit.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name runquest.veloxisit.com.br;

    ssl_certificate /etc/letsencrypt/live/runquest.veloxisit.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runquest.veloxisit.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8M;

    # Backend
    location /api/ {
        proxy_pass         http://runquest-api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Webhook MP: garantir raw body intacto
        proxy_request_buffering off;
    }

    # Frontend Next.js
    location / {
        proxy_pass         http://runquest-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # PWA assets imutáveis
    location ~* \.(?:png|jpg|jpeg|svg|webp|gif|ico|woff2)$ {
        proxy_pass http://runquest-web:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
